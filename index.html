<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMK IPTEK SANGGABUANA KARAWANG</title>
    <!-- LIBS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- INTERNAL CSS -->
    <style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
body { font-family: 'Plus Jakarta Sans', sans-serif; }


.print-only { font-family: "Times New Roman", Times, serif; color: black; line-height: 1.5; }

@media print {
    @page { size: A4; margin: 0; }
    .no-print { display: none !important; }
    .print-only { 
        display: block !important; 
        position: relative !important; 
        width: 210mm !important;
        min-height: 297mm !important; 
        padding: 1.5cm !important; 
        margin: 0 auto !important;
        background: white !important;
        box-shadow: none !important;
        border: none !important;
        box-sizing: border-box;
        font-family: "Times New Roman", Times, serif;
        color: black;
        line-height: 1.5;
        transform: none !important;
    }
    body, html { background: white !important; margin: 0 !important; padding: 0 !important; width: 100% !important; height: auto !important; overflow: visible !important; }
    #root, main, .print-wrapper, .flex-1 { display: block !important; position: static !important; overflow: visible !important; height: auto !important; width: 100% !important; }
    aside, header { display: none !important; }
}

.custom-scroll::-webkit-scrollbar { width: 4px; }
.custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

.bell-bounce { animation: bounce 0.5s ease-in-out infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* Style Chart Lingkaran Sederhana */
.pie-chart {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: conic-gradient(#ef4444 0% 35%, #f59e0b 35% 70%, #3b82f6 70% 100%);
}

    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <!-- INTERNAL JS (BABEL) -->
    <script type="text/babel">
const { useState, useEffect } = React;

const FormPengaduan = () => {
    const [status, setStatus] = useState('idle');

    useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
    }, [status]);

    const handleSubmit = async (e) => {
        e.preventDefault();
        setStatus('loading');
        const fd = new FormData(e.target);
        const data = { nama: fd.get('nama'), kelas: fd.get('kelas'), isi: fd.get('isi') };
        
        try {
            const res = await fetch('api_pengaduan.php', {
                method: 'POST',
                body: fd
            });
            if(res.ok) setStatus('success');
            else throw new Error('Gagal PHP');
        } catch(err) {
            const file = fd.get('foto');
            if (file && file.size > 0) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    data.foto = reader.result;
                    localStorage.setItem('newReport', JSON.stringify(data));
                    setStatus('success');
                };
                reader.readAsDataURL(file);
            } else {
                localStorage.setItem('newReport', JSON.stringify(data));
                setStatus('success');
            }
        }
    };

    if (status === 'success') {
        return (
            <div className="flex h-screen items-center justify-center bg-slate-50 p-4">
                <div className="bg-white p-8 rounded-3xl shadow-xl text-center max-w-md w-full animate-in zoom-in duration-500">
                    <div className="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i data-lucide="check-circle" className="w-10 h-10"></i>
                    </div>
                    <h2 className="text-2xl font-black text-slate-800 mb-2">Laporan Terkirim!</h2>
                    <p className="text-slate-500 text-sm mb-8">Terima kasih atas laporan Anda. Guru BK akan segera menindaklanjuti.</p>
                    <button onClick={() => setStatus('idle')} className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold uppercase text-xs hover:bg-slate-800 transition-colors">Kembali</button>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-slate-50 p-4 md:p-8 flex items-center justify-center relative overflow-hidden">
            <div className="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-500/20 rounded-full mix-blend-multiply filter blur-[80px] opacity-70 animate-pulse"></div>
            <div className="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-indigo-500/20 rounded-full mix-blend-multiply filter blur-[80px] opacity-70 animate-pulse"></div>
            
            <div className="bg-white p-6 md:p-10 rounded-[2rem] shadow-xl w-full max-w-lg relative z-10 animate-in fade-in slide-in-from-bottom-8 duration-700">
                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
                <div className="text-center mb-8">
                    <div className="bg-blue-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="message-square" className="w-8 h-8 text-blue-600"></i>
                    </div>
                    <h1 className="text-2xl font-black text-slate-800 tracking-tight">Form Pengaduan Siswa</h1>
                    <p className="text-xs text-slate-500 mt-2 uppercase tracking-widest font-bold">SMK IPTEK SANGGABUANA</p>
                </div>
                
                <form onSubmit={handleSubmit} className="space-y-5">
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">Nama Lengkap</label>
                        <input name="nama" required className="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all text-sm font-semibold" placeholder="Contoh: Budi Santoso" />
                    </div>
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">Kelas</label>
                        <input name="kelas" required className="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all text-sm font-semibold" placeholder="Contoh: XII TKJ 1" />
                    </div>
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">Laporan / Keluhan</label>
                        <textarea name="isi" required rows="4" className="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all text-sm font-semibold custom-scroll" placeholder="Tuliskan laporan atau masalah Anda secara detail..."></textarea>
                    </div>
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">Foto / Bukti (Opsional)</label>
                        <input type="file" name="foto" accept="image/*" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all text-sm font-semibold file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                    </div>
                    
                    <button type="submit" disabled={status === 'loading'} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:-translate-y-1 transition-all flex justify-center items-center gap-2 mt-4 disabled:opacity-50">
                        {status === 'loading' ? 'Mengirim...' : <><i data-lucide="send" className="w-4 h-4"></i> Kirim Laporan</>}
                    </button>
                </form>
            </div>
        </div>
    );
};

const PortalSiswa = () => {
    const [status, setStatus] = useState('idle'); // idle, loading, success
    const [studentData, setStudentData] = useState(null);
    const [violations, setViolations] = useState([]);
    const [errorMsg, setErrorMsg] = useState('');
    const [isChangePin, setIsChangePin] = useState(false);

    useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
    }, [status, isChangePin, studentData, violations, errorMsg]);

    const handleLogin = async (e) => {
        e.preventDefault();
        setStatus('loading');
        setErrorMsg('');
        const fd = new FormData(e.target);
        const nis = fd.get('nis');
        const pin = fd.get('pin');
        
        try {
            const res = await fetch('api_siswa.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', nis, pin })
            });
            const data = await res.json();
            if(data.status === 'success') {
                setStudentData(data.student);
                setViolations(data.violations);
                setStatus('success');
            } else {
                setErrorMsg(data.message || 'Login gagal!');
                setStatus('idle');
            }
        } catch(err) {
            setErrorMsg('Tidak dapat terhubung ke server. Pastikan Guru BK sudah membuka aplikasi hari ini.');
            setStatus('idle');
        }
    };

    const handleChangePin = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        const fd = new FormData(e.target);
        const pinLama = fd.get('pinLama');
        const pinBaru = fd.get('pinBaru');
        const confirmPin = fd.get('confirmPin');
        
        if (pinBaru !== confirmPin) {
            setErrorMsg('Konfirmasi PIN baru tidak cocok!');
            return;
        }

        try {
            const res = await fetch('api_siswa.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', nis: studentData.nis, pin: pinLama, newPin: pinBaru })
            });
            const data = await res.json();
            if(data.status === 'success') {
                alert('PIN Berhasil diubah!');
                setIsChangePin(false);
            } else {
                setErrorMsg(data.message || 'Gagal mengubah PIN!');
            }
        } catch(err) {
            setErrorMsg('Tidak dapat terhubung ke server.');
        }
    };

    if (status === 'success' && studentData) {
        return (
            <div className="min-h-screen bg-slate-50 p-4 md:p-8 flex flex-col items-center">
                <div className="w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden animate-in fade-in slide-in-from-bottom-8 duration-700">
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 text-white relative overflow-hidden">
                        <div className="absolute top-[-20%] left-[-10%] w-[300px] h-[300px] bg-white/10 rounded-full mix-blend-screen"></div>
                        <div className="relative z-10 flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-4">
                                <div className="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center border border-white/30">
                                    <i data-lucide="user" className="w-8 h-8 text-white"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black tracking-tight">{studentData.name}</h1>
                                    <p className="text-blue-100 font-medium">NIS: {studentData.nis} • Kelas: {studentData.class}</p>
                                </div>
                            </div>
                            <div className="flex flex-col items-center md:items-end gap-2">
                                <span className={`px-4 py-1.5 rounded-full text-xs font-black uppercase ${studentData.status === 'BAHAYA' ? 'bg-red-500 text-white shadow-[0_0_15px_rgba(239,68,68,0.5)]' : studentData.status === 'WASPADA' ? 'bg-amber-500 text-white' : 'bg-blue-100 text-blue-800'}`}>
                                    Status: {studentData.status}
                                </span>
                                <button onClick={() => {setStatus('idle'); setStudentData(null);}} className="text-[10px] font-bold text-blue-200 hover:text-white uppercase tracking-widest flex items-center gap-1">
                                    <i data-lucide="log-out" className="w-3 h-3"></i> Keluar
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="p-8 space-y-8">
                        <div className="flex flex-col md:flex-row gap-6">
                            <div className="flex-1 bg-slate-50 border border-slate-100 p-6 rounded-2xl flex items-center justify-between shadow-sm">
                                <div>
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Total Poin Pelanggaran</p>
                                    <h2 className="text-5xl font-black text-slate-800">{studentData.points}</h2>
                                </div>
                                <div className={`w-16 h-16 rounded-full flex items-center justify-center ${studentData.points > 20 ? 'bg-red-100 text-red-500' : 'bg-emerald-100 text-emerald-500'}`}>
                                    <i data-lucide={studentData.points > 20 ? "alert-triangle" : "check-circle"} className="w-8 h-8"></i>
                                </div>
                            </div>
                            <div className="flex-1 bg-amber-50 border border-amber-100 p-6 rounded-2xl shadow-sm cursor-pointer hover:bg-amber-100 transition-colors" onClick={() => setIsChangePin(!isChangePin)}>
                                <div className="flex items-center gap-4 h-full">
                                    <div className="w-12 h-12 bg-amber-200/50 rounded-full flex items-center justify-center text-amber-600">
                                        <i data-lucide="key" className="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-amber-900">Ubah PIN Keamanan</h3>
                                        <p className="text-xs text-amber-700/70">Pastikan akun Anda aman.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {isChangePin && (
                            <form onSubmit={handleChangePin} className="bg-white border-2 border-amber-100 p-6 rounded-2xl space-y-4 animate-in slide-in-from-top-4">
                                <h4 className="font-black text-amber-900 text-sm mb-4 flex items-center gap-2"><i data-lucide="lock" className="w-4 h-4"></i> Form Ubah PIN</h4>
                                {errorMsg && <div className="bg-red-50 text-red-500 p-3 rounded-xl text-xs font-bold">{errorMsg}</div>}
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase">PIN Lama</label>
                                    <input name="pinLama" type="password" required className="w-full bg-slate-50 border p-3 rounded-xl text-sm outline-none focus:border-amber-500" placeholder="••••••••" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase">PIN Baru</label>
                                    <input name="pinBaru" type="password" required className="w-full bg-slate-50 border p-3 rounded-xl text-sm outline-none focus:border-amber-500" placeholder="••••••••" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase">Konfirmasi PIN Baru</label>
                                    <input name="confirmPin" type="password" required className="w-full bg-slate-50 border p-3 rounded-xl text-sm outline-none focus:border-amber-500" placeholder="••••••••" />
                                </div>
                                <div className="pt-2 flex gap-2">
                                    <button type="submit" className="bg-amber-500 hover:bg-amber-600 text-white px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest shadow-lg shadow-amber-500/30 transition-colors">Simpan PIN</button>
                                    <button type="button" onClick={() => setIsChangePin(false)} className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest transition-colors">Batal</button>
                                </div>
                            </form>
                        )}

                        <div>
                            <h3 className="font-black text-slate-800 mb-4 flex items-center gap-2">
                                <i data-lucide="list" className="w-5 h-5 text-blue-500"></i> Riwayat Pelanggaran
                            </h3>
                            <div className="space-y-3">
                                {violations.length === 0 ? (
                                    <div className="text-center p-10 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                        <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300">
                                            <i data-lucide="shield-check" className="w-8 h-8"></i>
                                        </div>
                                        <p className="text-slate-500 font-bold">Hebat! Belum ada catatan pelanggaran.</p>
                                        <p className="text-xs text-slate-400 mt-1">Pertahankan sikap dan disiplin yang baik.</p>
                                    </div>
                                ) : (
                                    violations.map(v => (
                                        <div key={v.id} className="flex flex-col sm:flex-row sm:items-center justify-between bg-white border border-slate-200 p-4 rounded-xl hover:shadow-md transition-shadow gap-2">
                                            <div>
                                                <p className="text-xs font-bold text-slate-400 uppercase">{v.date}</p>
                                                <p className="font-bold text-slate-800">{v.type}</p>
                                                {v.note && <p className="text-[11px] text-slate-500 italic mt-1">Catatan: {v.note}</p>}
                                            </div>
                                            <div className="bg-red-50 text-red-600 font-black px-4 py-2 rounded-lg text-sm self-start sm:self-auto border border-red-100">
                                                +{v.pts} POIN
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-slate-50 p-4 md:p-8 flex items-center justify-center relative overflow-hidden">
            <div className="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-emerald-500/20 rounded-full mix-blend-multiply filter blur-[80px] opacity-70 animate-pulse"></div>
            <div className="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-teal-500/20 rounded-full mix-blend-multiply filter blur-[80px] opacity-70 animate-pulse"></div>
            
            <div className="bg-white p-6 md:p-10 rounded-[2rem] shadow-xl w-full max-w-sm relative z-10 animate-in fade-in slide-in-from-bottom-8 duration-700">
                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-500 to-teal-500"></div>
                <div className="text-center mb-8">
                    <div className="bg-emerald-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-emerald-100 shadow-sm">
                        <i data-lucide="user-check" className="w-8 h-8 text-emerald-600"></i>
                    </div>
                    <h1 className="text-2xl font-black text-slate-800 tracking-tight">Portal Siswa</h1>
                    <p className="text-[10px] text-slate-500 mt-2 uppercase tracking-widest font-bold">Cek Poin Pelanggaran</p>
                </div>
                
                {errorMsg && (
                    <div className="bg-red-50 text-red-500 p-4 rounded-2xl text-xs mb-6 font-bold flex items-center gap-3 border border-red-100 animate-in shake">
                        <i data-lucide="alert-triangle" className="w-5 h-5 flex-shrink-0"></i>
                        {errorMsg}
                    </div>
                )}
                
                <form onSubmit={handleLogin} className="space-y-5">
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">NIS (Nomor Induk Siswa)</label>
                        <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="credit-card" className="w-5 h-5"></i>
                            </div>
                            <input name="nis" required className="w-full bg-slate-50 border border-slate-200 py-4 pl-12 pr-4 rounded-2xl outline-none focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 transition-all text-sm font-semibold" placeholder="Masukkan NIS Anda" />
                        </div>
                    </div>
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">PIN Keamanan</label>
                        <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="lock" className="w-5 h-5"></i>
                            </div>
                            <input name="pin" type="password" required className="w-full bg-slate-50 border border-slate-200 py-4 pl-12 pr-4 rounded-2xl outline-none focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 transition-all text-sm font-semibold" placeholder="Default: NIS Anda" />
                        </div>
                    </div>
                    
                    <button type="submit" disabled={status === 'loading'} className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:-translate-y-1 transition-all flex justify-center items-center gap-2 mt-4 disabled:opacity-50">
                        {status === 'loading' ? 'Memeriksa...' : <><i data-lucide="log-in" className="w-4 h-4"></i> Masuk</>}
                    </button>
                    
                    <p className="text-[10px] text-center text-slate-400 mt-4 px-4 leading-relaxed font-medium">Jika belum pernah mengubah PIN, silakan masukkan NIS sebagai PIN Anda.</p>
                </form>
            </div>
        </div>
    );
};

const App = () => {
    const [isAuthenticated, setIsAuthenticated] = useState(false);
    const [loginError, setLoginError] = useState('');
    const [activeTab, setActiveTab] = useState('Dashboard');
    const [isSidebarOpen, setSidebarOpen] = useState(true);
    const [isChangePasswordMode, setIsChangePasswordMode] = useState(false);
    
    const [students, setStudents] = useState([]);
    const [graduatedStudents, setGraduatedStudents] = useState([]);
    const [violations, setViolations] = useState([]);
    const [prestasi, setPrestasi] = useState([]);
    const [homeVisits, setHomeVisits] = useState([]);
    const [monitoringHistory, setMonitoringHistory] = useState([]);
    const [scriptUrl, setScriptUrl] = useState('');
    const [isSyncing, setIsSyncing] = useState(false);
    
    // LOGO & SECURITY STATE
    const [logoUrl, setLogoUrl] = useState("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbMusPN1fa4M-B-AbV3wflipQpI0MNwGnHXg&s");
    const [passwordHash, setPasswordHash] = useState('240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9'); // Default: admin123

    const [notifications, setNotifications] = useState([]);
    const [pengaduans, setPengaduans] = useState([]);
    const [showInbox, setShowInbox] = useState(false);
    const [selectedStudentDetail, setSelectedStudentDetail] = useState(null);
    
    const [searchGlobal, setSearchGlobal] = useState('');
    const [searchInForm, setSearchInForm] = useState('');
    const [isModalOpen, setIsModalOpen] = useState(false);
    const [modalType, setModalType] = useState('');
    const [publicQrUrl, setPublicQrUrl] = useState(window.location.origin + window.location.pathname + '?page=pengaduan');

    // SURAT PANGGILAN STATE & TEMPLATE

        address: '', 
        statement: '', 
        reason: '',
        parentName: '',
        parentJob: '',
        staffName: 'YAYAT SETIAWAN, S.T',
        staffNip: '-',
        staffPosition: 'Guru BK SMK IPTEK SANGGABUANA',
        petugas2: '-',
        date: new Date().toISOString().split('T')[0]
    });
    const [letterTemplate, setLetterTemplate] = useState({
        header: "Pemerintah Kabupaten Karawang",
        subHeader: "SMK IPTEK SANGGABUANA KARAWANG",

    });

    useEffect(() => { lucide.createIcons(); }, [isAuthenticated, loginError, activeTab, isSidebarOpen, isModalOpen, students, violations, prestasi, homeVisits, notifications, showInbox, selectedStudentDetail, logoUrl, pengaduans]);

    useEffect(() => {
        const handleStorageChange = () => {
            const pendingReport = localStorage.getItem('newReport');
            if (pendingReport) {
                const data = JSON.parse(pendingReport);
                data.id = Date.now();
                data.timestamp = new Date().toISOString();
                setPengaduans(prev => [data, ...prev]);
                setNotifications(prev => [{
                    id: Date.now(),
                    msg: `PENGADUAN SISWA: ${data.nama} (${data.kelas}) - ${data.isi}`,
                    read: false
                }, ...prev]);
                localStorage.removeItem('newReport');
                new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
            }
        };
        window.addEventListener('storage', handleStorageChange);
        
        const pollReports = async () => {
            try {
                const res = await fetch('api_pengaduan.php?clear=1');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) {
                        setPengaduans(prev => [...data, ...prev]);
                        setNotifications(prev => {
                            const newNotifs = data.map(d => ({
                                id: Date.now() + Math.random(),
                                msg: `PENGADUAN BARU: ${d.nama} (${d.kelas}) - ${d.isi}`,
                                read: false
                            }));
                            return [...newNotifs, ...prev];
                        });
                        new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
                    }
                }
            } catch(e) { }
        };
        const interval = setInterval(pollReports, 5000);
        
        fetch('api_pengaduan.php?get_ip=1')
            .then(res => res.json())
            .then(data => {
                if(data && data.ip) {
                    const port = window.location.port ? ':' + window.location.port : '';
                    setPublicQrUrl(`http://${data.ip}${port}${window.location.pathname}?page=pengaduan`);
                    setPublicQrUrlSiswa(`http://${data.ip}${port}${window.location.pathname}?page=siswa`);
                }
            }).catch(e => console.log('Tidak menggunakan PHP/XAMPP IP'));
            
        // LOAD DATA FROM STORAGE ON MOUNT
        const savedData = localStorage.getItem('bk_panel_db');
        if (savedData) {
            const parsed = JSON.parse(savedData);
            const validSId = new Set((parsed.students || []).map(s => s.id));

            if (parsed.students) setStudents(parsed.students);
            if (parsed.graduatedStudents) setGraduatedStudents(parsed.graduatedStudents);
            
            // Filter orphans (riwayat yang tertinggal dari siswa yang sudah dihapus sebelumnya)
            if (parsed.violations) setViolations(parsed.violations.filter(v => validSId.has(Number(v.sId))));
            if (parsed.prestasi) setPrestasi(parsed.prestasi.filter(p => validSId.has(Number(p.sId))));
            if (parsed.homeVisits) setHomeVisits(parsed.homeVisits.filter(h => validSId.has(Number(h.sId))));
            if (parsed.monitoringHistory) setMonitoringHistory(parsed.monitoringHistory.filter(m => validSId.has(Number(m.sId))));
            
            if (parsed.logoUrl) setLogoUrl(parsed.logoUrl);
            if (parsed.passwordHash) setPasswordHash(parsed.passwordHash);
            if (parsed.notifications) setNotifications(parsed.notifications);
            if (parsed.pengaduans) setPengaduans(parsed.pengaduans);
            if (parsed.scriptUrl) setScriptUrl(parsed.scriptUrl);
        }

        const auth = localStorage.getItem('bk_auth');
        if (auth === 'true') {
            setIsAuthenticated(true);
        }

        return () => {
            window.removeEventListener('storage', handleStorageChange);
            clearInterval(interval);
        };
    }, []);

    // SAVE DATA TO STORAGE ON EVERY CHANGE
    useEffect(() => {
        const db = {
            students,
            graduatedStudents,
            violations,
            prestasi,
            homeVisits,
            monitoringHistory,
            logoUrl,
            passwordHash,
            notifications,
            pengaduans,
            scriptUrl
        };
        localStorage.setItem('bk_panel_db', JSON.stringify(db));
        
        // AUTO SYNC DATA UNTUK PORTAL SISWA DI PHP LOKAL
        fetch('api_siswa.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sync: true, students: db.students, violations: db.violations })
        }).catch(e => console.log("PHP sync error (bisa diabaikan jika tidak pakai PHP lokal)"));

        // AUTO SYNC BACKGROUND KE GOOGLE SHEETS
        if (scriptUrl) {
            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(db)
            }).catch(e => console.error("Auto-sync error", e));
        }
    }, [students, graduatedStudents, violations, prestasi, homeVisits, monitoringHistory, logoUrl, passwordHash, notifications, pengaduans, scriptUrl]);

    const syncToCloud = async () => {
        if (!scriptUrl) return alert("Masukkan URL Google Script terlebih dahulu di Dashboard!");
        setIsSyncing(true);
        try {
            const db = { students, graduatedStudents, violations, prestasi, homeVisits, monitoringHistory, logoUrl, passwordHash, notifications };
            await fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(db)
            });
            setNotifications([{ id: Date.now(), msg: `CLOUD SYNC: Data berhasil diunggah ke Google Sheets.`, read: false }, ...notifications]);
            alert("Berhasil Sinkronisasi ke Cloud!");
        } catch (err) {
            console.error(err);
            alert("Gagal sinkronisasi. Cek URL atau koneksi internet.");
        }
        setIsSyncing(false);
    };

    const fetchFromCloud = async () => {
        if (!scriptUrl) return alert("Masukkan URL Google Script terlebih dahulu di Dashboard!");
        setIsSyncing(true);
        try {
            const res = await fetch(scriptUrl);
            const data = await res.json();
            if (data.students) setStudents(data.students);
            if (data.graduatedStudents) setGraduatedStudents(data.graduatedStudents);
            if (data.violations) setViolations(data.violations);
            if (data.prestasi) setPrestasi(data.prestasi);
            if (data.homeVisits) setHomeVisits(data.homeVisits);
            if (data.monitoringHistory) setMonitoringHistory(data.monitoringHistory);
            if (data.logoUrl) setLogoUrl(data.logoUrl);
            if (data.passwordHash) setPasswordHash(data.passwordHash);
            alert("Data berhasil diunduh dari Cloud!");
        } catch (err) {
            console.error(err);
            alert("Gagal mengunduh data. Pastikan URL benar dan Apps Script sudah di-deploy.");
        }
        setIsSyncing(false);
    };

    const getStatus = (pts) => {
        if (pts > 50) return 'BAHAYA';
        if (pts >= 20) return 'WASPADA';
        if (pts > 0) return 'PEMBINAAN';
        return 'AKTIF';
    };

    const deleteStudent = (id) => {
        if(confirm("Apakah Anda yakin ingin menghapus data siswa ini? Semua riwayat pelanggaran juga akan terhapus.")) {
            setStudents(students.filter(s => s.id !== id));
            setViolations(violations.filter(v => v.sId !== id));
            // Juga hapus data lain yang terkait agar tidak menjadi sampah (orphaned data)
            setPrestasi(prestasi.filter(p => Number(p.sId) !== id));
            setHomeVisits(homeVisits.filter(h => Number(h.sId) !== id));
            setMonitoringHistory(monitoringHistory.filter(m => Number(m.sId) !== id));
        }
    };

    const [editStudent, setEditStudent] = useState(null);
    const handleEditStudent = (student) => {
        setEditStudent(student);
        setModalType('student_edit');
        setIsModalOpen(true);
    };

    const handleUpdateStudent = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        setStudents(students.map(s => s.id === editStudent.id ? { 
            ...s, 
            nis: fd.get('nis'), 
            name: fd.get('name'), 
            class: fd.get('class') 
        } : s));
        setIsModalOpen(false);
        setEditStudent(null);
    };

    const handleAddStudent = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newStudent = { id: Date.now(), nis: fd.get('nis'), name: fd.get('name'), class: fd.get('class'), points: 0, status: 'AKTIF' };
        setStudents([...students, newStudent]);
        setNotifications([{ id: Date.now(), msg: `Siswa baru terdaftar: ${newStudent.name}`, read: false }, ...notifications]);
        setIsModalOpen(false);
    };

    const handleAddViolation = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const sId = Number(fd.get('sId'));
        const pts = parseInt(fd.get('pts'));
        const type = fd.get('type');
        const sName = students.find(s => s.id === sId)?.name;

        setViolations([{ id: Date.now(), sId, type, date: fd.get('date'), pts, note: fd.get('note') }, ...violations]);
        setStudents(students.map(s => {
            if(s.id === sId) {
                const newPts = s.points + pts;
                return { ...s, points: newPts, status: getStatus(newPts) };
            }
            return s;
        }));
        setNotifications([{ id: Date.now(), msg: `PELANGGARAN BARU: ${sName} - ${type}`, read: false }, ...notifications]);
        setIsModalOpen(false);
        setSearchInForm('');
    };

    const handleAddPrestasi = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        setPrestasi([{ id: Date.now(), sId: Number(fd.get('sId')), rank: fd.get('rank'), event: fd.get('event'), className: fd.get('className'), date: fd.get('date') }, ...prestasi]);
        setIsModalOpen(false);
    };

    const handleAddGraduatedStudent = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        setGraduatedStudents([{ id: Date.now(), nis: fd.get('nis'), name: fd.get('name'), class: fd.get('class'), reason: fd.get('reason'), date: fd.get('date') }, ...graduatedStudents]);
        setIsModalOpen(false);
    };

    const handleAddMonitoring = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        setMonitoringHistory([{ id: Date.now(), sId: Number(fd.get('sId')), date: fd.get('date'), note: fd.get('note') }, ...monitoringHistory]);
        setIsModalOpen(false);
    };

    const handleAddHomeVisit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        setHomeVisits([{ id: Date.now(), sId: Number(fd.get('sId')), wali: fd.get('wali'), result: fd.get('result'), date: fd.get('date') }, ...homeVisits]);
        setIsModalOpen(false);
    };

    const hashString = async (string) => {
        const msgBuffer = new TextEncoder().encode(string);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const handleChangePassword = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const oldPass = fd.get('oldPass');
        const newPass = fd.get('newPass');
        const confirmPass = fd.get('confirmPass');

        const hashedOld = await hashString(oldPass);
        if (hashedOld !== passwordHash) {
            alert('Password lama salah!');
            return;
        }
        if (newPass !== confirmPass) {
            alert('Password baru tidak cocok dengan konfirmasi!');
            return;
        }
        if (newPass.length < 8) {
            alert('Password baru harus minimal 8 karakter untuk keamanan!');
            return;
        }

        const hashedNew = await hashString(newPass);
        setPasswordHash(hashedNew);
        setIsChangePasswordMode(false);
        setNotifications([{ id: Date.now(), msg: `KEAMANAN: Password login berhasil diubah.`, read: false }, ...notifications]);
        alert('Password berhasil diubah! Data otomatis disinkronisasi ke cloud jika URL terhubung.');
    };

    const downloadExcelTemplate = () => {
        const ws = XLSX.utils.json_to_sheet([{ NIS: "12345678", Nama: "Contoh Siswa", Kelas: "XII TKJ 1" }]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "DataSiswa");
        XLSX.writeFile(wb, "Template_Data_Siswa.xlsx");
    };

    const handleImportExcel = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const wsname = wb.SheetNames[0];
                const ws = wb.Sheets[wsname];
                const data = XLSX.utils.sheet_to_json(ws);

                const newStudents = data.map(item => ({
                    id: Date.now() + Math.random(),
                    nis: item.NIS || item.nis || item.Nis || '',
                    name: item.Nama || item.nama || item.Name || item.name || '',
                    class: item.Kelas || item.kelas || item.Class || item.class || '',
                    points: 0,
                    status: 'AKTIF'
                })).filter(s => s.nis && s.name);

                if (newStudents.length > 0) {
                    setStudents(prev => [...prev, ...newStudents]);
                    setNotifications([{ id: Date.now(), msg: `${newStudents.length} Siswa berhasil diimpor via file.`, read: false }, ...notifications]);
                    alert(`${newStudents.length} siswa berhasil diimpor!`);
                } else {
                    alert("Tidak ada data valid yang ditemukan. Pastikan header kolom adalah NIS, Nama, dan Kelas.");
                }
            } catch (err) {
                console.error(err);
                alert("Gagal membaca file. Pastikan format file benar.");
            }
        };
        reader.readAsBinaryString(file);
    };

            {isSidebarOpen && <span className="text-sm font-semibold">{label}</span>}
        </button>
    );

    const handleLogin = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const user = fd.get('username');
        const pass = fd.get('password');
        
        const hashedPass = await hashString(pass);
        
        if (user === 'gurubk' && hashedPass === passwordHash) {
            setIsAuthenticated(true);
            localStorage.setItem('bk_auth', 'true');
            setLoginError('');
        } else {
            setLoginError('Username atau password salah. Akses khusus Guru BK.');
        }
    };

    const handleLogout = () => {
        if(confirm("Apakah Anda yakin ingin keluar?")) {
            setIsAuthenticated(false);
            localStorage.removeItem('bk_auth');
        }
    };

    if (!isAuthenticated) {
        return (
            <div className="flex h-screen items-center justify-center bg-slate-900 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] relative overflow-hidden">
                <div className="absolute inset-0 overflow-hidden pointer-events-none">
                    <div className="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-pulse duration-[10s]"></div>
                    <div className="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-indigo-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-pulse duration-[12s]"></div>
                </div>
                
                <div className="bg-slate-900/80 backdrop-blur-2xl p-10 rounded-[2.5rem] shadow-[0_0_50px_rgba(0,0,0,0.5)] border border-slate-700 w-full max-w-md relative z-10 animate-in fade-in slide-in-from-bottom-8 duration-700">
                    <div className="text-center mb-8">
                        <div className="bg-white p-3 rounded-2xl inline-block mb-6 shadow-2xl rotate-3 hover:rotate-0 transition-transform duration-300">

                        <h1 className="text-3xl font-black text-white tracking-tight">PORTAL GURU BK</h1>
                        <p className="text-xs text-blue-400 mt-2 font-bold tracking-widest uppercase">SMK IPTEK SANGGABUANA</p>
                    </div>
                    
                    {loginError && (

                            <i data-lucide="alert-triangle" className="w-5 h-5 flex-shrink-0"></i>

                    {isChangePasswordMode ? (

                                <i data-lucide="key" className="w-5 h-5 flex-shrink-0"></i>
                                Ganti Password Login
                            </div>
                            <div className="space-y-2">
                                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">Password Lama</label>
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-blue-400 transition-colors">
                                        <i data-lucide="lock" className="w-5 h-5"></i>
                                    </div>
                                    <input name="oldPass" type="password" className="w-full bg-slate-800/50 border border-slate-700 text-white placeholder-slate-600 p-4 pl-12 rounded-2xl outline-none focus:border-blue-500 focus:bg-slate-800 focus:ring-4 focus:ring-blue-500/20 transition-all font-medium text-sm" required placeholder="••••••••" />
                                </div>

                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-blue-400 transition-colors">
                                        <i data-lucide="check-circle" className="w-5 h-5"></i>

                                    <input name="confirmPass" type="password" className="w-full bg-slate-800/50 border border-slate-700 text-white placeholder-slate-600 p-4 pl-12 rounded-2xl outline-none focus:border-blue-500 focus:bg-slate-800 focus:ring-4 focus:ring-blue-500/20 transition-all font-medium text-sm" required placeholder="••••••••" />
                                </div>

                            <div className="pt-2">

                    ) : (

                                    </div>
                                    <input name="password" type="password" className="w-full bg-slate-800/50 border border-slate-700 text-white placeholder-slate-600 p-4 pl-12 rounded-2xl outline-none focus:border-blue-500 focus:bg-slate-800 focus:ring-4 focus:ring-blue-500/20 transition-all font-medium text-sm" required placeholder="••••••••" />

                            <div className="pt-2">
                                <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)] hover:-translate-y-1 flex items-center justify-center gap-3">

                    )}
                    
                    <div className="mt-8 text-center pt-6 border-t border-slate-800">
                        <p className="text-[10px] text-slate-500 font-medium">© {new Date().getFullYear()} Sistem Informasi Bimbingan Konseling.<br/>Hanya untuk akses internal.</p>
                    </div>
                </div>
            </div>
        );
    }

    return (
        <div className="flex h-screen overflow-hidden">
            {/* SIDEBAR */}
            <aside className={`${isSidebarOpen ? 'w-64' : 'w-20'} bg-slate-900 text-white transition-all duration-300 no-print`}>
                <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                    <img src={logoUrl} alt="Logo" className="w-8 h-8 object-contain bg-white rounded-full p-1" />
                    {isSidebarOpen && <span className="font-bold text-lg tracking-tight uppercase">BK PANEL</span>}
                </div>
                <nav className="p-4 space-y-2 overflow-y-auto h-[calc(100vh-100px)] custom-scroll">
                    <SidebarItem id="Dashboard" icon="layout-dashboard" label="Dashboard" />
                    <SidebarItem id="Data Siswa" icon="users" label="Data Siswa" />
                    <SidebarItem id="Siswa Keluar" icon="user-minus" label="Siswa Keluar" />
                    <SidebarItem id="Pelanggaran" icon="clipboard-list" label="Pelanggaran" />
                    <SidebarItem id="Surat & Dokumen" icon="mail" label="Surat & Dokumen" />
                    <SidebarItem id="Hasil Pengaduan" icon="inbox" label="Hasil Pengaduan" />
                    <SidebarItem id="Home Visit" icon="home" label="Home Visit" />
                </nav>
            </aside>

            <main className="flex-1 flex flex-col overflow-hidden bg-slate-50">
                <header className="h-16 bg-white border-b flex items-center justify-between px-8 no-print relative">
                    <div className="flex items-center gap-4">
                        <button onClick={() => setSidebarOpen(!isSidebarOpen)} className="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="menu"></i></button>
                        <h2 className="font-bold text-slate-600 uppercase text-xs tracking-widest">{activeTab}</h2>
                    </div>
                    
                    <div className="flex items-center gap-6">
                        <div className="relative">
                            <button onClick={() => setShowInbox(!showInbox)} className="p-2 hover:bg-slate-100 rounded-full relative">
                                <i data-lucide="bell" className={`w-5 h-5 ${notifications.some(n => !n.read) ? 'text-blue-600 bell-bounce' : 'text-slate-400'}`}></i>
                                {notifications.some(n => !n.read) && (
                                    <span className="absolute top-0 right-0 w-4 h-4 bg-red-500 text-white text-[8px] flex items-center justify-center rounded-full font-bold">
                                        {notifications.filter(n => !n.read).length}
                                    </span>
                                )}
                            </button>
                            {showInbox && (
                                <div className="absolute right-0 mt-2 w-72 bg-white border shadow-2xl rounded-2xl z-50 overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                                        <h3 className="text-xs font-black uppercase text-slate-500">Pesan Masuk</h3>
                                        <div className="flex gap-3">
                                            <button onClick={() => setNotifications(notifications.map(n => ({...n, read: true})))} className="text-[10px] text-blue-600 font-bold">Tandai Dibaca</button>
                                            <button onClick={() => confirm("Hapus semua riwayat notifikasi?") && setNotifications([])} className="text-[10px] text-red-500 font-bold">Hapus Semua</button>
                                        </div>
                                    </div>
                                    <div className="max-h-64 overflow-y-auto custom-scroll">
                                        {notifications.length === 0 ? <p className="p-4 text-center text-xs text-slate-400">Tidak ada pesan.</p> : notifications.map(n => (
                                            <div key={n.id} className={`p-4 border-b text-[11px] leading-relaxed ${!n.read ? 'bg-blue-50' : 'text-slate-500'}`}>{n.msg}</div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="text-right"><p className="text-[10px] font-bold text-slate-400 uppercase">SMK IPTEK SANGGABUANA</p></div>
                            <img src={logoUrl} className="w-8 h-8 rounded-full bg-slate-100 p-1 object-contain" />
                            <div className="w-px h-8 bg-slate-200 mx-1"></div>
                            <button onClick={handleLogout} className="p-2 bg-red-50 text-red-500 rounded-full hover:bg-red-500 hover:text-white transition shadow-sm" title="Keluar">
                                <i data-lucide="log-out" className="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </header>

                <div className="flex-1 overflow-y-auto p-8 custom-scroll">
                    {activeTab === 'Dashboard' && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 gap-6">
                                <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 rounded-3xl text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-6">
                                    <div>
                                        <h2 className="text-xl font-black mb-2 tracking-tight">QR Code Pengaduan</h2>
                                        <p className="text-blue-100 text-xs max-w-sm">Untuk form lapor masalah secara rahasia oleh siswa.</p>
                                    </div>
                                    <button onClick={() => {setModalType('qrcode'); setIsModalOpen(true)}} className="bg-white text-blue-600 px-5 py-3 rounded-2xl font-black uppercase tracking-widest text-[10px] flex items-center gap-2 hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.3)] whitespace-nowrap">
                                        <i data-lucide="qr-code" className="w-5 h-5"></i> Tampilkan
                                    </button>
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="bg-blue-100 p-3 rounded-full text-blue-600"><i data-lucide="cloud"></i></div>
                                    <div>
                                        <h2 className="font-bold text-lg">Cloud Database Sync</h2>
                                        <p className="text-xs text-slate-400">Hubungkan ke Google Sheets untuk backup data permanen.</p>
                                    </div>
                                </div>
                                <div className="flex gap-2 w-full md:w-auto">
                                    <input 
                                        type="text" 
                                        placeholder="Paste Apps Script URL..." 
                                        className="text-xs border p-2 rounded-xl flex-1 md:w-80 outline-none focus:ring-2 focus:ring-blue-500"
                                        value={scriptUrl}
                                        onChange={(e) => setScriptUrl(e.target.value)}
                                    />
                                    <button onClick={fetchFromCloud} disabled={isSyncing} className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-200">Unduh</button>
                                    <button onClick={syncToCloud} disabled={isSyncing} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-700 flex items-center gap-2">
                                        {isSyncing ? '...' : <><i data-lucide="refresh-cw" className="w-3 h-3"></i> Sync</>}
                                    </button>
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-4">
                                    <img src={logoUrl} className="w-16 h-16 object-contain p-2 border rounded-full bg-slate-50" />
                                    <div>
                                        <h2 className="font-bold text-lg">Konfigurasi Instansi</h2>
                                        <p className="text-xs text-slate-400">Sesuaikan identitas visual sekolah Anda.</p>
                                    </div>
                                </div>
                                <div className="flex gap-2 w-full md:w-auto">
                                    <input 
                                        type="text" 
                                        placeholder="Tempel URL Logo Baru..." 
                                        className="text-xs border p-2 rounded-xl flex-1 md:w-64 outline-none focus:ring-2 focus:ring-blue-500"
                                        onBlur={(e) => e.target.value && setLogoUrl(e.target.value)}
                                    />
                                    <button className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold">Ganti Logo</button>
                                </div>
                            </div>



                            <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                <div className="bg-white p-6 rounded-2xl border shadow-sm"><p className="text-slate-400 text-xs font-bold uppercase">Total Siswa</p><h3 className="text-3xl font-black">{students.length}</h3></div>
                                <div className="bg-white p-6 rounded-2xl border shadow-sm border-l-4 border-red-500"><p className="text-slate-400 text-xs font-bold uppercase">Pelanggaran</p><h3 className="text-3xl font-black text-red-600">{violations.length}</h3></div>
                                <div className="bg-white p-6 rounded-2xl border shadow-sm border-l-4 border-blue-500"><p className="text-slate-400 text-xs font-bold uppercase">Home Visit</p><h3 className="text-3xl font-black text-blue-600">{homeVisits.length}</h3></div>
                            </div>
                            
                            <div className="bg-white p-6 rounded-2xl border shadow-sm">
                                <h4 className="font-bold text-slate-700 mb-4 flex items-center gap-2 text-sm"><i data-lucide="history" className="w-4 h-4 text-blue-500"></i> Aktivitas Terbaru</h4>
                                <div className="space-y-3">
                                    {violations.length === 0 ? <p className="text-xs text-slate-400 italic">Belum ada data terbaru.</p> : violations.slice(0,3).map(v => (
                                        <div key={v.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                                            <span className="text-xs font-bold">{students.find(s=>s.id==v.sId)?.name} <span className="font-normal text-slate-400 ml-2">Melakukan {v.type}</span></span>
                                            <span className="text-[10px] font-black text-red-500">+{v.pts} POIN</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}



                    {activeTab === 'Data Siswa' && (
                        <div className="bg-white rounded-2xl border shadow-sm">
                            <div className="p-4 border-b flex justify-between bg-slate-50/50">
                                <input type="text" placeholder="Cari siswa..." className="border px-4 py-2 rounded-xl text-sm w-64 outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setSearchGlobal(e.target.value)} />
                                <div className="flex gap-2">
                                    <button onClick={downloadExcelTemplate} className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-800 transition shadow-sm flex items-center gap-2">
                                        <i data-lucide="download" className="w-4 h-4"></i> Template
                                    </button>
                                    <label className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer flex items-center gap-2 hover:bg-emerald-700 transition shadow-sm">
                                        <i data-lucide="file-up" className="w-4 h-4"></i> Import Excel
                                        <input type="file" className="hidden" accept=".xlsx, .xls, .csv" onChange={handleImportExcel} />
                                    </label>
                                    <button onClick={() => {setModalType('student'); setIsModalOpen(true)}} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-700 transition">+ Siswa</button>
                                </div>
                            </div>
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase border-b">
                                    <tr><th className="p-4">NIS</th><th className="p-4">Nama</th><th className="p-4">Kelas</th><th className="p-4">Poin</th><th className="p-4">Status</th><th className="p-4">Aksi</th></tr>
                                </thead>
                                <tbody className="divide-y text-sm">
                                    {students.length === 0 ? <tr><td colSpan="6" className="p-8 text-center text-slate-400 italic">Belum ada data siswa.</td></tr> : students.filter(s => s.name.toLowerCase().includes(searchGlobal.toLowerCase())).map(s => (
                                        <tr key={s.id} className="hover:bg-blue-50/50 transition">
                                            <td className="p-4 font-mono text-xs">{s.nis}</td>
                                            <td className="p-4 font-bold">{s.name}</td>
                                            <td className="p-4">{s.class}</td>
                                            <td className="p-4 font-black text-blue-600">{s.points}</td>
                                            <td className="p-4"><span className={`px-2 py-1 rounded-lg text-[10px] font-black ${s.status === 'BAHAYA' ? 'bg-red-100 text-red-600' : s.status === 'WASPADA' ? 'bg-amber-100 text-amber-600' : 'bg-blue-100 text-blue-600'}`}>{s.status}</span></td>
                                            <td className="p-4 flex gap-2">
                                                <button onClick={() => setSelectedStudentDetail(s)} className="text-blue-500 hover:bg-blue-100 p-1 rounded" title="Lihat Detail"><i data-lucide="eye" className="w-4 h-4"></i></button>
                                                <button onClick={() => handleEditStudent(s)} className="text-amber-500 hover:bg-amber-100 p-1 rounded" title="Edit Data"><i data-lucide="edit" className="w-4 h-4"></i></button>
                                                <button onClick={() => deleteStudent(s.id)} className="text-red-400 hover:text-red-600 p-1"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {activeTab === 'Siswa Keluar' && (
                        <div className="bg-white rounded-2xl border shadow-sm animate-in fade-in duration-500">
                            <div className="p-4 border-b flex justify-between bg-slate-50/50">
                                <h3 className="font-bold text-sm">Data Siswa Keluar / Pindah / Lulus</h3>
                                <button onClick={() => {setModalType('graduated'); setIsModalOpen(true)}} className="bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-700 transition shadow-sm flex items-center gap-2"><i data-lucide="user-minus" className="w-4 h-4"></i> Tambah Data</button>
                            </div>
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase border-b">
                                    <tr><th className="p-4">NIS</th><th className="p-4">Nama</th><th className="p-4">Kelas</th><th className="p-4">Alasan</th><th className="p-4">Tanggal Keluar</th><th className="p-4">Aksi</th></tr>
                                </thead>
                                <tbody className="divide-y text-sm">
                                    {graduatedStudents.length === 0 ? <tr><td colSpan="6" className="p-8 text-center text-slate-400 italic">Belum ada data siswa keluar.</td></tr> : graduatedStudents.map(s => (
                                        <tr key={s.id} className="hover:bg-red-50/50 transition">
                                            <td className="p-4 font-mono text-xs">{s.nis}</td>
                                            <td className="p-4 font-bold text-slate-800">{s.name}</td>
                                            <td className="p-4 text-slate-600">{s.class}</td>
                                            <td className="p-4"><span className="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] font-black uppercase">{s.reason}</span></td>
                                            <td className="p-4 text-xs font-semibold text-slate-500">{s.date}</td>
                                            <td className="p-4 flex gap-2">
                                                <button onClick={() => confirm("Hapus data riwayat ini?") && setGraduatedStudents(graduatedStudents.filter(item => item.id !== s.id))} className="text-red-400 hover:text-red-600 p-1 bg-red-50 hover:bg-red-100 rounded transition"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {selectedStudentDetail && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden">
                                <div className="p-6 bg-slate-900 text-white flex justify-between items-center">
                                    <h3 className="font-bold">Detail Pelanggaran: {selectedStudentDetail.name}</h3>
                                    <button onClick={() => setSelectedStudentDetail(null)}><i data-lucide="x"></i></button>
                                </div>
                                <div className="p-6 h-96 overflow-y-auto custom-scroll">
                                    <div className="space-y-3">
                                        {violations.filter(v => v.sId === selectedStudentDetail.id).length === 0 ? <p className="text-center text-slate-400 text-sm py-10 italic">Belum ada catatan pelanggaran.</p> : 
                                            violations.filter(v => v.sId === selectedStudentDetail.id).map(v => (
                                                <div key={v.id} className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                                                    <div>
                                                        <p className="text-xs font-bold uppercase">{v.type}</p>
                                                        <p className="text-[10px] text-slate-500">{v.date}</p>
                                                    </div>
                                                    <span className="text-red-600 font-black text-sm">+{v.pts}</span>
                                                </div>
                                            ))
                                        }
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}



                    {/* HASIL PENGADUAN SECTION */}
                    {activeTab === 'Hasil Pengaduan' && (
                        <div className="space-y-4 animate-in fade-in duration-500">
                            <div className="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm">
                                <h3 className="font-bold text-sm">Hasil Pengaduan Siswa</h3>
                                <button onClick={() => {if(confirm('Hapus semua data pengaduan?')) setPengaduans([])}} className="bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-700 transition">Kosongkan Kotak</button>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {pengaduans.length === 0 ? <p className="text-slate-400 italic col-span-full bg-white p-8 rounded-2xl border text-center text-sm shadow-sm">Belum ada pengaduan masuk.</p> : pengaduans.map((p, idx) => (
                                    <div key={p.id || idx} className="bg-white p-6 rounded-2xl border shadow-sm flex flex-col gap-4 relative overflow-hidden group">
                                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-500 to-orange-500"></div>
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h4 className="font-black text-slate-800 text-sm">{p.nama}</h4>
                                                <p className="text-xs font-bold text-slate-400">Kelas {p.kelas}</p>
                                            </div>
                                            <span className="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded-lg font-bold">{p.timestamp ? new Date(p.timestamp).toLocaleString('id-ID') : 'Baru saja'}</span>
                                        </div>
                                        <p className="text-xs text-slate-600 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100">{p.isi}</p>
                                        {p.foto && <img src={p.foto} alt="Bukti" onClick={() => setSelectedImage(p.foto)} className="w-full h-auto rounded-xl border border-slate-200 mt-2 object-cover max-h-48 cursor-pointer hover:opacity-80 transition-opacity" title="Klik untuk memperbesar" />}
                                        <button onClick={() => setPengaduans(pengaduans.filter(item => item.id !== p.id))} className="text-[10px] text-red-500 font-bold text-left hover:underline">Hapus Pengaduan</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}



                    {/* SURAT & DOKUMEN SECTION */}
                    {activeTab === 'Surat & Dokumen' && (
                        <div className="flex flex-col lg:flex-row gap-8 h-[calc(100vh-120px)]">
                            <div className="w-full lg:w-1/3 flex flex-col gap-6 no-print overflow-y-auto custom-scroll pr-2 pb-10">
                                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm relative">
                                    <h3 className="font-black mb-6 text-sm flex items-center gap-3">
                                        <div className="bg-slate-900 text-white p-2 rounded-xl"><i data-lucide="edit-3" className="w-4 h-4"></i></div>
                                        Form Pemilihan Surat
                                    </h3>
                                    <div className="space-y-5">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Jenis Surat</label>
                                            <select className="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl text-sm font-semibold outline-none focus:border-blue-500 focus:bg-white transition-colors" value={letter.type} onChange={e => setLetter({...letter, type: e.target.value})}>
                                                {['Panggilan Orang Tua', 'Laporan Kunjungan Rumah', 'Surat Pernyataan Siswa', 'Surat Pengunduran Diri'].map(t => (
                                                    <option key={t} value={t}>{t}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Siswa Terkait</label>
                                            <select className="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl text-sm font-semibold outline-none focus:border-blue-500 focus:bg-white transition-colors" value={letter.sId} onChange={e => setLetter({...letter, sId: e.target.value})}>
                                                <option value="">-- Pilih Siswa --</option>
                                                {students.map(s => <option key={s.id} value={s.id}>{s.name} (Kelas {s.class})</option>)}
                                            </select>
                                        </div>
                                        
                                        {letter.type !== 'Surat Pengunduran Diri' && (
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Nomor Surat</label>
                                                <input type="text" placeholder="045/BK/2026" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl text-sm font-semibold outline-none focus:border-blue-500 focus:bg-white transition-colors" value={letter.no} onChange={e => setLetter({...letter, no: e.target.value})} />
                                            </div>
                                        )}
                                        
                                        {letter.type === 'Panggilan Orang Tua' && (
                                            <div className="space-y-5 animate-in slide-in-from-right-4 duration-300">
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Waktu Pertemuan</label>
                                                    <input type="datetime-local" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl text-sm font-semibold outline-none focus:border-blue-500 focus:bg-white transition-colors" onChange={e => setLetter({...letter, time: e.target.value})} />
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Keperluan / Masalah</label>
                                                    <textarea placeholder="Contoh: Membicarakan absensi siswa yang kurang..." className="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl text-sm font-semibold outline-none focus:border-blue-500 focus:bg-white transition-colors custom-scroll" rows="3" onChange={e => setLetter({...letter, info: e.target.value})}></textarea>
                                                </div>
                                            </div>
                                        )}

                                        {letter.type === 'Laporan Kunjungan Rumah' && (
                                            <div className="space-y-5 animate-in slide-in-from-right-4 duration-300">
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Nama Orang Tua</label>
                                                    <input type="text" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl text-sm font-semibold outline-none focus:border-blue-500 focus:bg-white transition-colors" placeholder="Nama lengkap orang tua..." value={letter.parentName} onChange={e => setLetter({...letter, parentName: e.target.value})} />
                                                </div>
